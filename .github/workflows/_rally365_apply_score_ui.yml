name: Rally365 one-time score UI update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply score-entry and match-history changes
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/page.tsx')
          text = path.read_text(encoding='utf-8')

          old = '''    // The database still uses its existing score columns for compatibility,\n    // but the UI treats them only as internal W/L placeholders.\n    const teamAScore = winnerTeam === "A" ? 1 : 0;\n    const teamBScore = winnerTeam === "B" ? 1 : 0;'''
          new = '''    const teamAScore = Number(scoreA);\n    const teamBScore = Number(scoreB);\n\n    if (!Number.isInteger(teamAScore) || !Number.isInteger(teamBScore) || teamAScore < 0 || teamBScore < 0) {\n      setError("Enter valid scores for both teams.");\n      return;\n    }\n    if (teamAScore === teamBScore) {\n      setError("A badminton match cannot be saved as a tie. Enter the winning score.");\n      return;\n    }\n\n    const scoreWinner = teamAScore > teamBScore ? "A" : "B";\n    if (winnerTeam !== scoreWinner) {\n      setError("Winner selection must match the entered score.");\n      return;\n    }'''
          assert old in text, 'saveMatch score block not found'
          text = text.replace(old, new, 1)

          old = '''    setTargetMatch(match);\n    setScoreA("");\n    setScoreB("");\n    setWinnerTeam(match.team_a_score > match.team_b_score ? "A" : "B");'''
          new = '''    setTargetMatch(match);\n    setScoreA(String(match.team_a_score));\n    setScoreB(String(match.team_b_score));\n    setWinnerTeam(match.team_a_score > match.team_b_score ? "A" : "B");'''
          assert old in text, 'openEdit score initialization not found'
          text = text.replace(old, new, 1)

          old = '''    const na = winnerTeam === "A" ? 1 : 0;\n    const nb = winnerTeam === "B" ? 1 : 0;'''
          new = '''    const na = Number(scoreA);\n    const nb = Number(scoreB);\n\n    if (!Number.isInteger(na) || !Number.isInteger(nb) || na < 0 || nb < 0) {\n      setError("Enter valid scores for both teams.");\n      return;\n    }\n    if (na === nb) {\n      setError("A badminton match cannot be saved as a tie. Enter the winning score.");\n      return;\n    }\n\n    const scoreWinner = na > nb ? "A" : "B";\n    if (winnerTeam !== scoreWinner) {\n      setError("Winner selection must match the entered score.");\n      return;\n    }'''
          assert old in text, 'edit score block not found'
          text = text.replace(old, new, 1)

          old = '''      })}</div><div className="match-preview"><b>{selected.slice(0, 2).map(name).join(" + ") || "—"}</b><span>vs</span><b>{selected.slice(2, 4).map(name).join(" + ") || "—"}</b></div>{selected.length === 4 && <div className="winner-select">'''
          new = '''      })}</div><div className="match-preview"><b>{selected.slice(0, 2).map(name).join(" + ") || "—"}</b><span>vs</span><b>{selected.slice(2, 4).map(name).join(" + ") || "—"}</b></div>{selected.length === 4 && <div>\n        <div style={{ display: "grid", gridTemplateColumns: "1fr auto 1fr", gap: 12, alignItems: "end", margin: "18px 0 14px" }}>\n          <label style={{ display: "grid", gap: 6, textAlign: "center", fontWeight: 700 }}>\n            <span style={{ fontSize: 12, color: "#789087", textTransform: "uppercase", letterSpacing: "0.08em" }}>Team A score</span>\n            <input inputMode="numeric" type="number" min="0" max="99" value={scoreA} placeholder="21" aria-label="Team A score" style={{ width: "100%", boxSizing: "border-box", textAlign: "center", fontSize: 22, fontWeight: 700, border: "1px solid #d9e5df", borderRadius: 12, padding: "11px 8px", background: "#fbfdfc" }} onChange={e => { const value = e.target.value.replace(/\\D/g, "").slice(0, 2); setScoreA(value); if (value !== "" && scoreB !== "" && Number(value) !== Number(scoreB)) setWinnerTeam(Number(value) > Number(scoreB) ? "A" : "B"); }} />\n          </label>\n          <span style={{ paddingBottom: 12, color: "#91a39b", fontWeight: 700 }}>–</span>\n          <label style={{ display: "grid", gap: 6, textAlign: "center", fontWeight: 700 }}>\n            <span style={{ fontSize: 12, color: "#789087", textTransform: "uppercase", letterSpacing: "0.08em" }}>Team B score</span>\n            <input inputMode="numeric" type="number" min="0" max="99" value={scoreB} placeholder="15" aria-label="Team B score" style={{ width: "100%", boxSizing: "border-box", textAlign: "center", fontSize: 22, fontWeight: 700, border: "1px solid #d9e5df", borderRadius: 12, padding: "11px 8px", background: "#fbfdfc" }} onChange={e => { const value = e.target.value.replace(/\\D/g, "").slice(0, 2); setScoreB(value); if (value !== "" && scoreA !== "" && Number(value) !== Number(scoreA)) setWinnerTeam(Number(value) > Number(scoreA) ? "B" : "A"); }} />\n          </label>\n        </div>\n        <div className="winner-select">'''
          assert old in text, 'new-match score UI insertion point not found'
          text = text.replace(old, new, 1)

          old = '''        </div>\n      </div>}\n      <button className="primary-button" disabled={selected.length !== 4 || !winnerTeam} onClick={saveMatch}>Save match</button></Modal>}'''
          new = '''        </div>\n        </div>}\n      </div>}\n      <button className="primary-button" disabled={selected.length !== 4 || !winnerTeam || scoreA === "" || scoreB === ""} onClick={saveMatch}>Save match</button></Modal>}'''
          assert old in text, 'new-match winner closing block not found'
          text = text.replace(old, new, 1)

          old = '''      <p className="helper">Admin verified. The match ID remains unchanged.</p>\n      <div className="match-preview"><b>{team(targetMatch, "A")}</b><span>vs</span><b>{team(targetMatch, "B")}</b></div>\n      <div className="winner-select">'''
          new = '''      <p className="helper">Admin verified. The match ID remains unchanged.</p>\n      <div className="match-preview"><b>{team(targetMatch, "A")}</b><span>vs</span><b>{team(targetMatch, "B")}</b></div>\n      <div style={{ display: "grid", gridTemplateColumns: "1fr auto 1fr", gap: 12, alignItems: "end", margin: "18px 0 14px" }}>\n        <label style={{ display: "grid", gap: 6, textAlign: "center", fontWeight: 700 }}>\n          <span style={{ fontSize: 12, color: "#789087", textTransform: "uppercase", letterSpacing: "0.08em" }}>Team A score</span>\n          <input inputMode="numeric" type="number" min="0" max="99" value={scoreA} aria-label="Team A score" style={{ width: "100%", boxSizing: "border-box", textAlign: "center", fontSize: 22, fontWeight: 700, border: "1px solid #d9e5df", borderRadius: 12, padding: "11px 8px", background: "#fbfdfc" }} onChange={e => { const value = e.target.value.replace(/\\D/g, "").slice(0, 2); setScoreA(value); if (value !== "" && scoreB !== "" && Number(value) !== Number(scoreB)) setWinnerTeam(Number(value) > Number(scoreB) ? "A" : "B"); }} />\n        </label>\n        <span style={{ paddingBottom: 12, color: "#91a39b", fontWeight: 700 }}>–</span>\n        <label style={{ display: "grid", gap: 6, textAlign: "center", fontWeight: 700 }}>\n          <span style={{ fontSize: 12, color: "#789087", textTransform: "uppercase", letterSpacing: "0.08em" }}>Team B score</span>\n          <input inputMode="numeric" type="number" min="0" max="99" value={scoreB} aria-label="Team B score" style={{ width: "100%", boxSizing: "border-box", textAlign: "center", fontSize: 22, fontWeight: 700, border: "1px solid #d9e5df", borderRadius: 12, padding: "11px 8px", background: "#fbfdfc" }} onChange={e => { const value = e.target.value.replace(/\\D/g, "").slice(0, 2); setScoreB(value); if (value !== "" && scoreA !== "" && Number(value) !== Number(scoreA)) setWinnerTeam(Number(value) > Number(scoreA) ? "B" : "A"); }} />\n        </label>\n      </div>\n      <div className="winner-select">'''
          assert old in text, 'edit score UI insertion point not found'
          text = text.replace(old, new, 1)

          old = '''      <div className="edit-modal-actions">\n        <button className="primary-button edit-save-button" onClick={saveEditedMatch}>'''
          new = '''      <div className="edit-modal-actions">\n        <button className="primary-button edit-save-button" disabled={scoreA === "" || scoreB === "" || !winnerTeam} onClick={saveEditedMatch}>'''
          assert old in text, 'edit save button not found'
          text = text.replace(old, new, 1)

          old = '''          {homeMatches.map((m, i) => <div className={`match-card ${i % 2 === 1 ? "match-card-alt" : ""} ${m.status === "VOIDED" ? "voided" : ""}`} key={m.id}><div className="match-number"><b>M{homeMatches.length - i}</b><small className="match-timestamp">{matchHistoryTime(m.played_at)}</small></div><div className="teams">\n                <div><strong className={m.team_a_score > m.team_b_score ? "home-team-win" : m.team_a_score < m.team_b_score ? "home-team-loss" : ""}>{team(m, "A")}</strong></div>\n                <div><strong className={m.team_b_score > m.team_a_score ? "home-team-win" : m.team_b_score < m.team_a_score ? "home-team-loss" : ""}>{team(m, "B")}</strong></div>\n                {m.status === "VOIDED" ? <small>VOIDED</small> : m.edit_count > 0 ? <small>Edited · {m.edit_count}x</small> : null}\n              </div>{m.status !== "VOIDED" && <button'''
          new = '''          {homeMatches.map((m, i) => <div className={`match-card home-history-score-card ${i % 2 === 1 ? "match-card-alt" : ""} ${m.status === "VOIDED" ? "voided" : ""}`} key={m.id} style={{ display: "grid", gridTemplateColumns: "auto minmax(0, 1fr) auto auto", gap: 14, alignItems: "center" }}>\n              <div className="match-number"><b>M{homeMatches.length - i}</b><small className="match-timestamp">Today, {matchHistoryTime(m.played_at)}</small></div>\n              <div className="teams">\n                <div style={{ display: "flex", alignItems: "center", gap: 8 }}><strong className={m.team_a_score > m.team_b_score ? "home-team-win" : m.team_a_score < m.team_b_score ? "home-team-loss" : ""}>{team(m, "A")}</strong>{m.status !== "VOIDED" && <span style={{ display: "inline-flex", alignItems: "center", padding: "4px 9px", borderRadius: 7, background: m.team_a_score > m.team_b_score ? "#d5f7e6" : "#fde1e1", color: m.team_a_score > m.team_b_score ? "#08784b" : "#b33b3b", fontSize: 12, fontWeight: 800 }}>{m.team_a_score > m.team_b_score ? "✓ WIN" : "L"}</span>}</div>\n                <div><strong className={m.team_b_score > m.team_a_score ? "home-team-win" : m.team_b_score < m.team_a_score ? "home-team-loss" : ""}>{team(m, "B")}</strong></div>\n                {m.status === "VOIDED" ? <small>VOIDED</small> : m.edit_count > 0 ? <small>Edited · {m.edit_count}x</small> : null}\n              </div>\n              <div style={{ minWidth: 58, border: "1px solid #dfe7e2", borderRadius: 12, padding: "8px 10px", background: "#f8fbf9", display: "grid", justifyItems: "center", lineHeight: 1.05 }}>\n                <b style={{ color: "#08784b", fontSize: 18 }}>{m.team_a_score}</b><span style={{ color: "#8a9a92", fontSize: 15 }}>{m.team_b_score}</span>\n              </div>{m.status !== "VOIDED" && <button'''
          assert old in text, 'home match history block not found'
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
      
      - name: Verify build
        run: |
          npm ci
          npm run build

      - name: Commit changes and remove one-time workflow
        run: |
          rm -f .github/workflows/_rally365_apply_score_ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx .github/workflows/_rally365_apply_score_ui.yml
          git diff --cached --quiet && exit 0
          git commit -m "Add match score entry and history UI"
          git push
