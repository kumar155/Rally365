name: Rally365 one-time score UI update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply score entry and history UI
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              'const teamAScore = winnerTeam === "A" ? 1 : 0;\n    const teamBScore = winnerTeam === "B" ? 1 : 0;',
              '''const teamAScore = Number(scoreA);\n    const teamBScore = Number(scoreB);\n    if (!Number.isInteger(teamAScore) || !Number.isInteger(teamBScore) || teamAScore < 0 || teamBScore < 0) { setError("Enter valid scores for both teams."); return; }\n    if (teamAScore === teamBScore) { setError("A badminton match cannot be saved as a tie."); return; }\n    const scoreWinner = teamAScore > teamBScore ? "A" : "B";\n    if (winnerTeam !== scoreWinner) { setError("Winner selection must match the entered score."); return; }''', 1)

          s = s.replace(
              'setTargetMatch(match);\n    setScoreA("");\n    setScoreB("");\n    setWinnerTeam(match.team_a_score > match.team_b_score ? "A" : "B");',
              'setTargetMatch(match);\n    setScoreA(String(match.team_a_score));\n    setScoreB(String(match.team_b_score));\n    setWinnerTeam(match.team_a_score > match.team_b_score ? "A" : "B");', 1)

          s = s.replace(
              'const na = winnerTeam === "A" ? 1 : 0;\n    const nb = winnerTeam === "B" ? 1 : 0;',
              '''const na = Number(scoreA);\n    const nb = Number(scoreB);\n    if (!Number.isInteger(na) || !Number.isInteger(nb) || na < 0 || nb < 0) { setError("Enter valid scores for both teams."); return; }\n    if (na === nb) { setError("A badminton match cannot be saved as a tie."); return; }\n    const scoreWinner = na > nb ? "A" : "B";\n    if (winnerTeam !== scoreWinner) { setError("Winner selection must match the entered score."); return; }''', 1)

          score_ui = '''<div style={{ display: "flex", gap: 10, alignItems: "center", margin: "16px 0" }}>\n        <input inputMode="numeric" type="number" min="0" max="99" value={scoreA} placeholder="21" aria-label="Team A score" onChange={e => setScoreA(e.target.value)} />\n        <span style={{ color: "#91a39b", fontWeight: 700 }}>–</span>\n        <input inputMode="numeric" type="number" min="0" max="99" value={scoreB} placeholder="15" aria-label="Team B score" onChange={e => setScoreB(e.target.value)} />\n      </div>'''

          new_anchor = '</div>{selected.length === 4 && <div className="winner-select">'
          new_repl = '</div>' + score_ui + '{selected.length === 4 && <div className="winner-select">'
          assert new_anchor in s, 'new match score insertion point not found'
          s = s.replace(new_anchor, new_repl, 1)

          edit_anchor = '<div className="match-preview"><b>{team(targetMatch, "A")}</b><span>vs</span><b>{team(targetMatch, "B")}</b></div>\n      <div className="winner-select">'
          edit_repl = '<div className="match-preview"><b>{team(targetMatch, "A")}</b><span>vs</span><b>{team(targetMatch, "B")}</b></div>\n      ' + score_ui + '\n      <div className="winner-select">'
          assert edit_anchor in s, 'edit match score insertion point not found'
          s = s.replace(edit_anchor, edit_repl, 1)

          s = s.replace(
              '<button className="primary-button" disabled={selected.length !== 4 || !winnerTeam} onClick={saveMatch}>Save match</button>',
              '<button className="primary-button" disabled={selected.length !== 4 || !winnerTeam || scoreA === "" || scoreB === ""} onClick={saveMatch}>Save match</button>', 1)
          s = s.replace(
              '<button className="primary-button edit-save-button" onClick={saveEditedMatch}>',
              '<button className="primary-button edit-save-button" disabled={scoreA === "" || scoreB === "" || !winnerTeam} onClick={saveEditedMatch}>', 1)

          old_history = '''{homeMatches.map((m, i) => <div className={`match-card ${i % 2 === 1 ? "match-card-alt" : ""} ${m.status === "VOIDED" ? "voided" : ""}`} key={m.id}><div className="match-number"><b>M{homeMatches.length - i}</b><small className="match-timestamp">{matchHistoryTime(m.played_at)}</small></div><div className="teams">\n                <div><strong className={m.team_a_score > m.team_b_score ? "home-team-win" : m.team_a_score < m.team_b_score ? "home-team-loss" : ""}>{team(m, "A")}</strong></div>\n                <div><strong className={m.team_b_score > m.team_a_score ? "home-team-win" : m.team_b_score < m.team_a_score ? "home-team-loss" : ""}>{team(m, "B")}</strong></div>\n                {m.status === "VOIDED" ? <small>VOIDED</small> : m.edit_count > 0 ? <small>Edited · {m.edit_count}x</small> : null}\n              </div>{m.status !== "VOIDED" && <button'''
          new_history = '''{homeMatches.map((m, i) => <div className={`match-card home-history-score-card ${i % 2 === 1 ? "match-card-alt" : ""} ${m.status === "VOIDED" ? "voided" : ""}`} key={m.id} style={{ display: "grid", gridTemplateColumns: "auto minmax(0, 1fr) auto auto", gap: 14, alignItems: "center" }}><div className="match-number"><b>M{homeMatches.length - i}</b><small className="match-timestamp">Today, {matchHistoryTime(m.played_at)}</small></div><div className="teams"><div><strong className={m.team_a_score > m.team_b_score ? "home-team-win" : m.team_a_score < m.team_b_score ? "home-team-loss" : ""}>{team(m, "A")}</strong></div><div><strong className={m.team_b_score > m.team_a_score ? "home-team-win" : m.team_b_score < m.team_a_score ? "home-team-loss" : ""}>{team(m, "B")}</strong></div>{m.status === "VOIDED" ? <small>VOIDED</small> : m.edit_count > 0 ? <small>Edited · {m.edit_count}x</small> : null}</div><div style={{ minWidth: 58, border: "1px solid #dfe7e2", borderRadius: 12, padding: "8px 10px", background: "#f8fbf9", display: "grid", justifyItems: "center", lineHeight: 1.05 }}><b style={{ color: "#08784b", fontSize: 18 }}>{m.team_a_score}</b><span style={{ color: "#8a9a92", fontSize: 15 }}>{m.team_b_score}</span></div>{m.status !== "VOIDED" && <button'''
          assert old_history in s, 'history block not found'
          s = s.replace(old_history, new_history, 1)

          p.write_text(s, encoding='utf-8')

      - name: Verify build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Commit changes and remove one-time workflow
        run: |
          rm -f .github/workflows/_rally365_apply_score_ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx .github/workflows/_rally365_apply_score_ui.yml
          git diff --cached --quiet && exit 0
          git commit -m "Add match score entry and history UI"
          git push
