name: Rally365 MVP score tiebreaker

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update MVP calculation
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text(encoding='utf-8')
          old = '''    // MVP of the selected Home date. Guests are excluded. We use wins first,\n    // then win rate, then matches as deterministic tie-breakers.\n    const mvpCandidates = eligiblePlayers.map(p => {\n      const pm = todayMatches.filter(m => m.match_players.some(x => x.player_id === p.id));\n      const wins = pm.filter(m => {\n        const side = m.match_players.find(x => x.player_id === p.id)?.team;\n        return side === "A" ? m.team_a_score > m.team_b_score : side === "B" ? m.team_b_score > m.team_a_score : false;\n      }).length;\n      const winRate = pm.length ? Math.round((wins / pm.length) * 100) : 0;\n      return { p, matches: pm.length, wins, winRate };\n    }).filter(x => x.matches > 0).sort((a, b) => b.wins - a.wins || b.winRate - a.winRate || b.matches - a.matches || a.p.name.localeCompare(b.p.name));'''
          new = '''    // MVP of the selected Home date. Guests are excluded. Wins are the\n    // primary criterion; total points are used only when wins are tied.\n    // Win rate and matches are deterministic fallbacks for a complete tie.\n    const mvpCandidates = eligiblePlayers.map(p => {\n      const pm = todayMatches.filter(m => m.match_players.some(x => x.player_id === p.id));\n      const wins = pm.filter(m => {\n        const side = m.match_players.find(x => x.player_id === p.id)?.team;\n        return side === "A" ? m.team_a_score > m.team_b_score : side === "B" ? m.team_b_score > m.team_a_score : false;\n      }).length;\n      const points = pm.reduce((total, m) => {\n        const side = m.match_players.find(x => x.player_id === p.id)?.team;\n        return total + (side === "A" ? Number(m.team_a_score || 0) : side === "B" ? Number(m.team_b_score || 0) : 0);\n      }, 0);\n      const winRate = pm.length ? Math.round((wins / pm.length) * 100) : 0;\n      return { p, matches: pm.length, wins, points, winRate };\n    }).filter(x => x.matches > 0).sort((a, b) => b.wins - a.wins || b.points - a.points || b.winRate - a.winRate || b.matches - a.matches || a.p.name.localeCompare(b.p.name));'''
          if old not in s:
              raise SystemExit('Expected MVP block not found; refusing to modify source')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

      - name: Verify build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Commit and remove temporary workflow
        run: |
          rm -f .github/workflows/_rally365_fix_mvp_tiebreak.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx .github/workflows/_rally365_fix_mvp_tiebreak.yml
          git diff --cached --quiet && exit 0
          git commit -m "Fix MVP score tiebreaker"
          git push
