name: Apply match history display fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix match history display formatting'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Apply match history formatting
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/page-legacy.tsx')
          text = path.read_text()

          old_heading = '<div className="section-title"><span>Match history</span><span>{homeMatches.length}</span></div>'
          new_heading = '<div className="section-title"><span>Match history ({homeMatches.length})</span></div>'
          if old_heading not in text:
              raise SystemExit('Expected match history heading was not found')
          text = text.replace(old_heading, new_heading, 1)

          old_badge = ': m.edit_count > 0 ? <small>Edited · {m.edit_count}x</small> : null}'
          new_badge = ': (m.last_edited_at || m.edit_count > 0) ? <small style={{ display: "inline-flex", alignItems: "center", width: "fit-content", marginTop: 6, padding: "3px 8px", borderRadius: 999, border: "1px solid #d7e8df", background: "#eef8f3", color: "#16885d", fontSize: 11, fontWeight: 800, letterSpacing: "0.5px", lineHeight: 1.2 }}>EDITED{m.last_edited_at ? ` · ${matchHistoryTime(m.last_edited_at)}` : ""}</small> : null}'
          if old_badge not in text:
              raise SystemExit('Expected edited badge was not found')
          text = text.replace(old_badge, new_badge, 1)

          path.write_text(text)
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page-legacy.tsx .github/workflows/apply-match-history-display-fix.yml
          git commit -m "Fix match history display formatting"
          git push origin main