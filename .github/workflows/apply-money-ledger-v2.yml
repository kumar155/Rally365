name: Rally365 Match History Fix
on: push
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply match history UX patch
        run: python scripts/fix-match-history-ux.py
      - name: Commit and clean up
        run: |
          git config user.name "Rally365 Bot"
          git config user.email "rally365-bot@users.noreply.github.com"
          git add app/page-legacy.tsx app/match-history-reference.css
          git rm -f scripts/fix-match-history-ux.py .github/workflows/fix-match-history-ux.yml .github/workflows/apply-money-ledger-v2.yml
          git commit -m "Fix match history styling and remove win tag"
          git push origin main
