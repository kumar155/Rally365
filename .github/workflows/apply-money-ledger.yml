name: Apply Money Ledger
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message != 'chore: apply money ledger implementation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python scripts/patch-money-ledger.py
      - name: Commit implementation
        run: |
          git config user.name "Rally365 Bot"
          git config user.email "rally365-bot@users.noreply.github.com"
          git add app/page.tsx app/globals.css supabase/migrations/202610030001_shared_expense_payers.sql
          git commit -m "chore: apply money ledger implementation"
          git push origin main
