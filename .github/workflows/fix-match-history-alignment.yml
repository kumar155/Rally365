name: Fix match history row alignment
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply alignment overrides and clean up
        run: |
          cat >> app/match-history-reference.css <<'EOF'

/* Final row alignment: keep match number/time left-aligned and content on a stable grid. */
.home-match-history .home-history-score-card {
  grid-template-columns: minmax(0, 1fr) 82px 36px !important;
  grid-template-rows: auto auto !important;
  column-gap: 14px !important;
  row-gap: 8px !important;
  align-items: center !important;
}
.home-match-history .home-history-score-card > .match-number {
  grid-column: 1 / -1 !important;
  grid-row: 1 !important;
  width: 100% !important;
  margin: 0 !important;
  padding: 0 !important;
  display: flex !important;
  align-items: center !important;
  justify-content: flex-start !important;
  text-align: left !important;
  gap: 10px !important;
}
.home-match-history .home-history-score-card > .match-number > b {
  margin: 0 !important;
  flex: 0 0 auto !important;
}
.home-match-history .home-history-score-card > .match-number > .match-timestamp {
  margin: 0 !important;
  flex: 0 0 auto !important;
}
.home-match-history .home-history-score-card > .teams {
  grid-column: 1 !important;
  grid-row: 2 !important;
  align-self: center !important;
  min-width: 0 !important;
}
.home-match-history .home-history-score-card > div:nth-child(3) {
  grid-column: 2 !important;
  grid-row: 2 !important;
  align-self: center !important;
}
.home-match-history .home-history-score-card > .edit-link {
  grid-column: 3 !important;
  grid-row: 2 !important;
  align-self: center !important;
}
@media (max-width: 420px) {
  .home-match-history .home-history-score-card {
    grid-template-columns: minmax(0, 1fr) 82px 36px !important;
    column-gap: 12px !important;
    row-gap: 7px !important;
  }
  .home-match-history .home-history-score-card > .match-number {
    gap: 8px !important;
  }
}
EOF
          git config user.name "Rally365 Bot"
          git config user.email "rally365-bot@users.noreply.github.com"
          git add app/match-history-reference.css
          git rm -f .github/workflows/fix-match-history-alignment.yml
          git commit -m "Fix match history row alignment and clean up"
          git push origin main
