name: Fix match history vs format

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix match history vs formatting'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply match history formatting
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/page.tsx')
          text = path.read_text(encoding='utf-8')

          helper = '''  const matchTeamLabel = (m: Match, t: "A" | "B") => {
            const raw = team(m, t).replace(/^vs\\s+/i, "").trim();
            return `vs ${raw.replace(/\\s*(?:\\/|&)\\s*/g, " - ")}`;
          };
          '''

          anchor = '  const team = (m: Match, t: "A" | "B") => m.match_players.filter(x => x.team === t).map(x => name(x.player_id)).join(" & ");\n'
          if 'const matchTeamLabel' not in text:
              if anchor not in text:
                  raise SystemExit('Could not find team helper anchor')
              text = text.replace(anchor, anchor + helper, 1)

          old_a = '{`vs ${team(m, "A").replace(/^vs\\s+/, "").replace(/\\s*\\/\\s*/g, " - ")}`}';
          old_b = '{`vs ${team(m, "B").replace(/^vs\\s+/, "").replace(/\\s*\\/\\s*/g, " - ")}`}';
          new_a = '{matchTeamLabel(m, "A")}';
          new_b = '{matchTeamLabel(m, "B")}';

          count_a = text.count(old_a)
          count_b = text.count(old_b)
          if count_a != 2 or count_b != 2:
              raise SystemExit(f'Expected 2 history occurrences of each expression; found A={count_a}, B={count_b}')

          text = text.replace(old_a, new_a).replace(old_b, new_b)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-match-history-vs-format.yml
          git add app/page.tsx .github/workflows/fix-match-history-vs-format.yml
          git commit -m "Fix match history vs formatting"
          git push origin main
