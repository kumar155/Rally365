name: Apply match history alignment patch v2

on:
  push:
    branches: [main]

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch match history UI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          page = Path('app/page.tsx')
          text = page.read_text()
          start_marker = '          {homeMatches.map((m, i) => <div className={`match-card home-history-score-card'
          end_marker = '\n        </div></>}'
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('Match history start marker not found')
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('Match history end marker not found')

          new = '''          {homeMatches.map((m, i) => {
            const aWon = m.team_a_score > m.team_b_score;
            const bWon = m.team_b_score > m.team_a_score;
            return <div className={`match-card home-history-score-card ${i % 2 === 1 ? "match-card-alt" : ""} ${m.status === "VOIDED" ? "voided" : ""}`} key={m.id}>
              <div className="home-history-meta">
                <span className="home-history-match-number">M{homeMatches.length - i}</span>
                <span className="home-history-time">Today, {matchHistoryTime(m.played_at)} <b>•</b></span>
              </div>
              <div className="home-history-body">
                <div className="home-history-teams">
                  <div className="home-history-team-row">
                    <strong className={`home-history-team-name ${aWon ? "winner" : bWon ? "loser" : ""}`}>{team(m, "A")}</strong>
                    {aWon && <span className="home-history-win-pill">✓ WIN</span>}
                  </div>
                  <div className="home-history-team-row">
                    <strong className={`home-history-team-name ${bWon ? "winner" : aWon ? "loser" : ""}`}>{team(m, "B")}</strong>
                    {bWon && <span className="home-history-win-pill">✓ WIN</span>}
                  </div>
                  {m.status === "VOIDED" ? <small>VOIDED</small> : m.edit_count > 0 ? <small>Edited · {m.edit_count}x</small> : null}
                </div>
                <div className="home-history-score" aria-label={`Score ${m.team_a_score} to ${m.team_b_score}`}>
                  <b className={aWon ? "score-winner" : "score-loser"}>{m.team_a_score}</b>
                  <span className={bWon ? "score-winner" : "score-loser"}>{m.team_b_score}</span>
                </div>
                {m.status !== "VOIDED" && <button
                  className="edit-link home-history-edit"
                  title="Edit match"
                  aria-label="Edit match"
                  onClick={() => openEdit(m)}
                >
                  <Pencil size={16} />
                </button>}
              </div>
            </div>;
          })}'''

          page.write_text(text[:start] + new + text[end:])

          css = Path('app/globals.css')
          css_text = css.read_text()
          marker = '/* Match history reference alignment */'
          if marker not in css_text:
              css_text += '''\n\n/* Match history reference alignment */\n.home-history-score-card { display:flex !important; flex-direction:column !important; align-items:stretch !important; gap:12px !important; padding:18px 16px !important; }\n.home-history-meta { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; width:100%; }\n.home-history-match-number { display:inline-flex; align-items:center; justify-content:center; min-width:58px; height:42px; padding:0 14px; border-radius:13px; background:#f1f5f3; color:#526a5d; font-size:15px; font-weight:900; }\n.home-history-time { color:#809297; font-size:14px; font-weight:600; line-height:1.2; }\n.home-history-time b { font-weight:900; }\n.home-history-body { display:grid; grid-template-columns:minmax(0,1fr) 58px 34px; gap:12px; align-items:center; width:100%; }\n.home-history-teams { min-width:0; display:flex; flex-direction:column; gap:12px; }\n.home-history-team-row { min-width:0; min-height:32px; display:flex; align-items:center; gap:10px; }\n.home-history-team-name { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#10231a !important; font-size:15px; line-height:1.25; font-weight:650; }\n.home-history-team-name.winner { font-weight:800; }\n.home-history-team-name.loser { font-weight:500; color:#10231a !important; }\n.home-history-win-pill { flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center; padding:5px 9px; border-radius:8px; background:#d8f5e7; color:#08784b; font-size:11px; font-weight:900; line-height:1; }\n.home-history-score { width:58px; min-height:76px; border:1px solid #dce7e1; border-radius:14px; background:#f8fbf9; display:grid; grid-template-rows:1fr 1fr; justify-items:center; align-items:center; padding:7px 10px; line-height:1; }\n.home-history-score b,.home-history-score span { font-size:18px; font-weight:800; }\n.home-history-score .score-winner { color:#08784b; }\n.home-history-score .score-loser { color:#8a9a92; }\n.home-history-edit { width:34px; height:34px; padding:0; align-self:center; background:transparent; color:#8aa0bd; }\n@media (max-width:420px) { .home-history-score-card { padding:16px 13px !important; } .home-history-body { grid-template-columns:minmax(0,1fr) 54px 32px; gap:9px; } .home-history-team-name { font-size:14px; } .home-history-win-pill { padding:5px 7px; font-size:10px; } .home-history-score { width:54px; min-height:72px; } }\n'''
              css.write_text(css_text)
          PY

      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/globals.css .github/workflows/patch-match-history-alignment-v2.yml
          git commit -m "fix: align today match history and neutralize team colors"
          git push
          git rm .github/workflows/patch-match-history-alignment-v2.yml
          git commit -m "chore: remove temporary match history patch workflow"
          git push
