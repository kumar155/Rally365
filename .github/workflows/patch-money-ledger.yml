name: Implement Money Ledger

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'chore: apply money ledger implementation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Money ledger
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('app/page.tsx')
          text = page.read_text()

          def replace_once(old, new, label):
              global text
              if old not in text:
                  raise SystemExit(f'Missing patch anchor: {label}')
              text = text.replace(old, new, 1)

          replace_once(
              'type Expense = { id: string; expense_date: string; category: string; amount: number; description: string | null };',
              'type Expense = { id: string; expense_date: string; category: string; amount: number; description: string | null; paid_by_player_id: string | null };\ntype ExpenseSplit = { expense_id: string; player_id: string; share_amount: number };',
              'expense type'
          )

          replace_once(
              '  const [expenses, setExpenses] = useState<Expense[]>([]);',
              '  const [expenses, setExpenses] = useState<Expense[]>([]);\n  const [expenseSplits, setExpenseSplits] = useState<ExpenseSplit[]>([]);',
              'expense split state'
          )

          replace_once(
              '  const [expenseCategory, setExpenseCategory] = useState("SHUTTLES"); const [expenseAmount, setExpenseAmount] = useState(""); const [expenseDesc, setExpenseDesc] = useState(""); const [split, setSplit] = useState<string[]>([]);',
              '  const [expenseCategory, setExpenseCategory] = useState("SHUTTLES"); const [expenseAmount, setExpenseAmount] = useState(""); const [expenseDesc, setExpenseDesc] = useState(""); const [split, setSplit] = useState<string[]>([]);\n  const [expensePayer, setExpensePayer] = useState("");\n  const [expandedExpenseId, setExpandedExpenseId] = useState<string | null>(null);\n  const [editingExpenseId, setEditingExpenseId] = useState<string | null>(null);\n  const [expenseDeleteId, setExpenseDeleteId] = useState<string | null>(null);',
              'expense form state'
          )

          replace_once(
              '    const [p, m, e, a, f, r] = await Promise.all([',
              '    const [p, m, e, s, a, f, r] = await Promise.all([',
              'load promise destructure'
          )

          replace_once(
              '    supabase\n      .from("expenses")\n      .select("id,expense_date,category,amount,description")\n      .eq("group_id", g.id)\n      .order("expense_date", { ascending: false }),\n\n    supabase\n      .from("attendance")',
              '    supabase\n      .from("expenses")\n      .select("id,expense_date,category,amount,description,paid_by_player_id")\n      .eq("group_id", g.id)\n      .order("expense_date", { ascending: false }),\n\n    supabase\n      .from("expense_splits")\n      .select("expense_id,player_id,share_amount")\n      .in("expense_id", (await supabase.from("expenses").select("id").eq("group_id", g.id)).data?.map((x: { id: string }) => x.id) || []),\n\n    supabase\n      .from("attendance")',
              'expense split query'
          )

          # Replace the nested query above with a safe independent query. The first version is intentionally
          # converted to a plain query because Supabase query builders should not be awaited inside the array.
          old = '''    supabase\n      .from("expense_splits")\n      .select("expense_id,player_id,share_amount")\n      .in("expense_id", (await supabase.from("expenses").select("id").eq("group_id", g.id)).data?.map((x: { id: string }) => x.id) || []),'''
          new = '''    supabase\n      .from("expense_splits")\n      .select("expense_id,player_id,share_amount")\n      .eq("group_id", g.id),'''
          replace_once(old, new, 'safe expense split query')

          replace_once(
              '    if (e.error) setError(e.error.message); else setExpenses((e.data || []) as Expense[]);\n    if (a.error)',
              '    if (e.error) setError(e.error.message); else setExpenses((e.data || []) as Expense[]);\n    if (s.error) setError(s.error.message); else setExpenseSplits((s.data || []) as ExpenseSplit[]);\n    if (a.error)',
              'load expense splits'
          )

          replace_once(
              '      .on("postgres_changes", { event: "*", schema: "public", table: "expenses", filter: `group_id=eq.${groupId}` }, load)',
              '      .on("postgres_changes", { event: "*", schema: "public", table: "expenses", filter: `group_id=eq.${groupId}` }, load)\n      .on("postgres_changes", { event: "*", schema: "public", table: "expense_splits" }, load)',
              'expense split realtime'
          )

          marker = '  const duoName = (ids: string[]) => ids.map(name).join(" & ");'
          ledger = r'''  const expenseLedger = useMemo(() => {
    const balance = new Map<string, number>();
    players.forEach(p => balance.set(p.id, 0));

    for (const expense of expenses) {
      if (expense.paid_by_player_id && balance.has(expense.paid_by_player_id)) {
        balance.set(expense.paid_by_player_id, (balance.get(expense.paid_by_player_id) || 0) + Number(expense.amount || 0));
      }
    }

    for (const splitRow of expenseSplits) {
      if (balance.has(splitRow.player_id)) {
        balance.set(splitRow.player_id, (balance.get(splitRow.player_id) || 0) - Number(splitRow.share_amount || 0));
      }
    }

    const rows = players.map(player => ({
      ...player,
      balance: Math.round((balance.get(player.id) || 0) * 100) / 100,
    })).sort((a, b) => b.balance - a.balance || a.name.localeCompare(b.name));

    const debtors = rows.filter(r => r.balance < -0.005).map(r => ({ id: r.id, amount: Math.round(-r.balance * 100) / 100 }));
    const creditors = rows.filter(r => r.balance > 0.005).map(r => ({ id: r.id, amount: Math.round(r.balance * 100) / 100 }));
    const settlements: { from: string; to: string; amount: number }[] = [];
    let di = 0;
    let ci = 0;
    while (di < debtors.length && ci < creditors.length) {
      const amount = Math.min(debtors[di].amount, creditors[ci].amount);
      if (amount > 0.005) settlements.push({ from: debtors[di].id, to: creditors[ci].id, amount: Math.round(amount * 100) / 100 });
      debtors[di].amount = Math.round((debtors[di].amount - amount) * 100) / 100;
      creditors[ci].amount = Math.round((creditors[ci].amount - amount) * 100) / 100;
      if (debtors[di].amount <= 0.005) di++;
      if (creditors[ci].amount <= 0.005) ci++;
    }

    return {
      rows,
      settlements,
      totalToPay: Math.round(rows.filter(r => r.balance < 0).reduce((s, r) => s - r.balance, 0) * 100) / 100,
      totalToReceive: Math.round(rows.filter(r => r.balance > 0).reduce((s, r) => s + r.balance, 0) * 100) / 100,
      unassignedExpenses: expenses.filter(e => !e.paid_by_player_id).length,
    };
  }, [players, expenses, expenseSplits]);

'''
          replace_once(marker, marker + '\n\n' + ledger.rstrip(), 'expense ledger calculations')

          old_add = '''  const addExpense = async () => {\n    if (!groupId || !adminOK || !expenseAmount || !split.length) return;\n    const amount = Number(expenseAmount), { data: e, error: ee } = await supabase.from("expenses").insert({ group_id: groupId, expense_date: new Date().toISOString().slice(0, 10), category: expenseCategory, amount, description: expenseDesc || null }).select("id").single();\n    if (ee || !e) { setError(ee?.message || "Could not save expense"); return }\n    const share = Math.round(amount / split.length * 100) / 100;\n    const { error: se } = await supabase.from("expense_splits").insert(split.map(player_id => ({ expense_id: e.id, player_id, share_amount: share })));\n    if (se) { setError(se.message); return }\n    setAdminOK(false); setModal(null); setExpenseAmount(""); setExpenseDesc(""); load();\n  };'''
          new_add = r'''  const addExpense = async () => {
    if (!groupId || !adminOK || !expenseAmount || !split.length || !expensePayer) {
      setError("Select who paid, enter an amount, and select at least one participant.");
      return;
    }
    const amount = Number(expenseAmount);
    if (!Number.isFinite(amount) || amount <= 0) {
      setError("Expense amount must be greater than ₹0.");
      return;
    }

    const payload = {
      group_id: groupId,
      expense_date: new Date().toISOString().slice(0, 10),
      category: expenseCategory,
      amount,
      description: expenseDesc || null,
      paid_by_player_id: expensePayer,
    };

    let expenseId = editingExpenseId;
    if (editingExpenseId) {
      const { error: updateError } = await supabase.from("expenses").update(payload).eq("id", editingExpenseId);
      if (updateError) { setError(updateError.message); return; }
      const { error: deleteSplitsError } = await supabase.from("expense_splits").delete().eq("expense_id", editingExpenseId);
      if (deleteSplitsError) { setError(deleteSplitsError.message); return; }
    } else {
      const { data: e, error: ee } = await supabase.from("expenses").insert(payload).select("id").single();
      if (ee || !e) { setError(ee?.message || "Could not save expense"); return; }
      expenseId = e.id;
    }

    const cents = Math.round(amount * 100);
    const base = Math.floor(cents / split.length);
    const remainder = cents % split.length;
    const splitRows = split.map((player_id, index) => ({
      expense_id: expenseId!,
      player_id,
      share_amount: (base + (index < remainder ? 1 : 0)) / 100,
    }));
    const { error: se } = await supabase.from("expense_splits").insert(splitRows);
    if (se) { setError(se.message); return; }

    setAdminOK(false); setModal(null); setExpenseAmount(""); setExpenseDesc(""); setExpensePayer(""); setSplit([]); setEditingExpenseId(null); await load();
  };'''
          replace_once(old_add, new_add, 'add/edit expense')

          old_money_start = '{tab === "money" && <>\n        <div className="page-heading">'
          money_start_index = text.index(old_money_start)
          money_end_marker = '      {tab === "duos" && <>'
          money_end_index = text.index(money_end_marker, money_start_index)

          new_money = r'''{tab === "money" && <>
        <div className="page-heading">
          <div className="eyebrow">GROUP LEDGER</div>
          <h1>Money</h1>
          <p>Shared expenses, balances and settlements.</p>
        </div>

        <div className="money-balance-grid">
          <div className="money-balance-card owe"><span>TO PAY</span><strong>{money(expenseLedger.totalToPay)}</strong><small>What the group owes on shared expenses</small></div>
          <div className="money-balance-card receive"><span>TO RECEIVE</span><strong>{money(expenseLedger.totalToReceive)}</strong><small>What the group should receive back</small></div>
        </div>

        {expenseLedger.unassignedExpenses > 0 && <div className="money-ledger-warning"><b>{expenseLedger.unassignedExpenses} older expense{expenseLedger.unassignedExpenses === 1 ? "" : "s"} need a payer.</b><span>Edit them below to include them in settlement calculations.</span></div>}

        <div className="section-title"><span>Admin actions</span><LockKeyhole size={14} /></div>
        <div className="admin-actions">
          <button className="money-action-purple money-stat-action" onClick={() => { setMoneyAction("fine"); openAdmin("money") }}><Clock3 /> Add fine</button>
          <button className="money-action-purple money-stat-action" onClick={() => { setMoneyAction("expense"); setEditingExpenseId(null); setExpensePayer(""); setSplit([]); openAdmin("money") }}><ReceiptText /> Add expense</button>
        </div>

        <div className="money-settlement-panel">
          <div className="section-title"><span>Settlements</span><span>{expenseLedger.settlements.length}</span></div>
          {expenseLedger.settlements.length === 0 ? <div className="empty-card">All shared expenses are settled.</div> : <div className="money-settlement-list">
            {expenseLedger.settlements.map((s, i) => <div className="money-settlement-row" key={`${s.from}-${s.to}-${i}`}>
              <div><b>{name(s.from)}</b><span>pays</span><b>{name(s.to)}</b></div>
              <strong>{money(s.amount)}</strong>
            </div>)}
          </div>}
        </div>

        <div className="money-balance-list">
          <div className="section-title"><span>Player balances</span><span>Expenses only</span></div>
          {expenseLedger.rows.map(row => <div className="money-balance-row" key={row.id}>
            <div><b>{row.name}</b><small>{row.balance > 0.005 ? "should receive" : row.balance < -0.005 ? "owes" : "settled"}</small></div>
            <strong className={row.balance > 0.005 ? "positive" : row.balance < -0.005 ? "negative" : "neutral"}>{row.balance > 0.005 ? "+" : row.balance < -0.005 ? "-" : ""}{money(Math.abs(row.balance))}</strong>
          </div>)}
        </div>

        <div className="section-title"><span>Monthly fine report</span><span>Fines only</span></div>
        <div className="month-picker">
          <button onClick={() => { const d = new Date(`${reportMonth}-01T12:00:00`); d.setMonth(d.getMonth() - 1); setReportMonth(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`); }}>‹</button>
          <b>{new Date(`${reportMonth}-01T12:00:00`).toLocaleDateString("en-IN", { month: "long", year: "numeric" })}</b>
          <button onClick={() => { const d = new Date(`${reportMonth}-01T12:00:00`); d.setMonth(d.getMonth() + 1); setReportMonth(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`); }}>›</button>
        </div>

        <div className="money-grid four">
          <div><b>{money(monthTotal)}</b><small>Total fines</small></div>
          <div><b>{money(monthLate)}</b><small>Late fines</small></div>
          <div><b>{money(monthMissed)}</b><small>Missed fines</small></div>
          <div><b>{monthLateCount + monthMissedCount}</b><small>Entries</small></div>
        </div>

        <div className="stats-table monthly-fines">
          <div className="table-head"><span>#</span><span>PLAYER</span><span>LATE</span><span>MISSED</span><span>TOTAL</span><span></span></div>
          {monthlyFineStats.map((s, i) => <button className="monthly-row" key={s.id} onClick={() => setFineDetailsPlayer(s.id)}>
            <span className="rank">{i + 1}</span><span className="player-name"><b>{s.name}</b><small>{s.lateCount} late · {s.missedCount} missed</small></span><span>{money(s.late)}</span><span>{money(s.missed)}</span><strong>{money(s.total)}</strong><ChevronRight size={16} />
          </button>)}
        </div>

        <div className="section-title"><span>Shared expenses</span><span>{monthlyExpenses.length}</span></div>
        <div className="match-list">
          {monthlyExpenses.length === 0 && <div className="empty-card">No expenses recorded for this month.</div>}
          {monthlyExpenses.map(e => {
            const rows = expenseSplits.filter(s => s.expense_id === e.id);
            const expanded = expandedExpenseId === e.id;
            return <div className={`money-expense-card ${expanded ? "expanded" : ""}`} key={e.id}>
              <button type="button" className="money-expense-summary" onClick={() => setExpandedExpenseId(expanded ? null : e.id)}>
                <div className="expense-icon">₹</div>
                <div className="money-expense-copy"><b>{e.category}</b><small>{money(Number(e.amount))} · {e.paid_by_player_id ? `Paid by ${name(e.paid_by_player_id)}` : "Payer not recorded"}</small><small>{new Date(e.expense_date + "T00:00:00").toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" })}{e.description ? ` · ${e.description}` : ""}</small></div>
                <ChevronDown size={18} className={expanded ? "money-chevron-open" : ""} />
              </button>
              {expanded && <div className="money-expense-detail">
                <div className="money-expense-detail-head"><b>Split</b><span>{rows.length} people</span></div>
                {rows.map(r => <div className="money-expense-split-row" key={`${e.id}-${r.player_id}`}><span>{name(r.player_id)}</span><strong>{money(Number(r.share_amount))}</strong></div>)}
                {rows.length === 0 && <div className="empty-card">No split recorded.</div>}
                <div className="money-expense-actions">
                  <button type="button" onClick={() => { setEditingExpenseId(e.id); setExpenseCategory(e.category); setExpenseAmount(String(e.amount)); setExpenseDesc(e.description || ""); setExpensePayer(e.paid_by_player_id || ""); setSplit(rows.map(r => r.player_id)); setMoneyAction("expense"); openAdmin("money"); }}>Edit expense</button>
                  <button type="button" className="danger-button" onClick={() => { setExpenseDeleteId(e.id); setMoneyAction("expense"); openAdmin("money"); }}>Delete</button>
                </div>
              </div>}
            </div>;
          })}
        </div>

        <div className="section-title"><span>Fines by player</span><span>Tap for history</span></div>
        <div className="stats-table">
          <div className="fine-player-header"><span>#</span><span>PLAYER</span><span>L</span><span>M</span><span>TOTAL</span><span></span></div>
          {finePlayerStats.map((s, i) => <button className="fine-player-row" key={s.id} onClick={() => setFineDetailsPlayer(s.id)}><span className="rank">{i + 1}</span><span className="player-name"><b>{s.name}</b><small>{s.entries} {s.entries === 1 ? "entry" : "entries"}{s.latest ? ` · Last ${new Date(`${s.latest}T12:00:00`).toLocaleDateString("en-IN", { day: "numeric", month: "short" })}` : " · No fines"}</small></span><span className="fine-value">{money(s.late)}</span><span className="fine-value">{money(s.missed)}</span><span className="fine-total">{money(s.total)}</span><ChevronRight size={17} /></button>)}
        </div>
      </>}

'''
          text = text[:money_start_index] + new_money + text[money_end_index:]

          # Expense modal: add payer and support editing.
          old_modal = '''    {modal === "expense" && <Modal title="Add expense" close={() => setModal(null)}><select value={expenseCategory} onChange={e => setExpenseCategory(e.target.value)}><option value="SHUTTLES">🏸 Shuttles</option><option value="BREAKFAST">🍳 Breakfast</option><option value="COFFEE">☕ Coffee</option><option value="OTHER">Other</option></select><input inputMode="decimal" placeholder="Amount ₹" value={expenseAmount} onChange={e => setExpenseAmount(e.target.value)} /><input placeholder="Description (optional)" value={expenseDesc} onChange={e => setExpenseDesc(e.target.value)} /><p className="helper">Split among</p><div className="selection-grid">{players.map(p => <button key={p.id} className={`player-chip ${split.includes(p.id) ? "selected" : ""}`} onClick={() => setSplit(x => x.includes(p.id) ? x.filter(y => y !== p.id) : [...x, p.id])}>{p.name}</button>)}</div>{split.length > 0 && <div className="split-preview">{money(Number(expenseAmount || 0) / split.length)} each · {split.length} people</div>}<button className="primary-button" onClick={addExpense}>Save expense</button></Modal>}'''
          new_modal = r'''    {modal === "expense" && <Modal title={editingExpenseId ? "Edit expense" : "Add expense"} close={() => { setEditingExpenseId(null); setModal(null); }}>
      <select value={expenseCategory} onChange={e => setExpenseCategory(e.target.value)}><option value="SHUTTLES">🏸 Shuttles</option><option value="BREAKFAST">🍳 Breakfast</option><option value="COFFEE">☕ Coffee</option><option value="OTHER">Other</option></select>
      <input inputMode="decimal" placeholder="Amount ₹" value={expenseAmount} onChange={e => setExpenseAmount(e.target.value)} />
      <select value={expensePayer} onChange={e => setExpensePayer(e.target.value)}><option value="">Paid by…</option>{players.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}</select>
      <input placeholder="Description (optional)" value={expenseDesc} onChange={e => setExpenseDesc(e.target.value)} />
      <p className="helper">Split among</p>
      <div className="selection-grid">{players.map(p => <button key={p.id} className={`player-chip ${split.includes(p.id) ? "selected" : ""}`} onClick={() => setSplit(x => x.includes(p.id) ? x.filter(y => y !== p.id) : [...x, p.id])}>{p.name}</button>)}</div>
      {split.length > 0 && <div className="split-preview">{money(Number(expenseAmount || 0) / split.length)} each · {split.length} people</div>}
      <button className="primary-button" disabled={!expensePayer || !expenseAmount || !split.length} onClick={addExpense}>{editingExpenseId ? "Save changes" : "Save expense"}</button>
    </Modal>}'''
          replace_once(old_modal, new_modal, 'expense modal')

          # Admin verification: handle expense deletion before normal money modal flow.
          marker = '    if (pinAction === "edit" && targetMatch) {'
          delete_branch = r'''    if (expenseDeleteId) {
      const { data: pinValid, error: pinError } = await supabase.rpc("verify_admin_pin", { p_group_id: groupId, p_pin: pin });
      if (pinError) { setError(pinError.message); return; }
      if (!pinValid) { setError("Invalid admin PIN"); return; }
      const { error: deleteSplitError } = await supabase.from("expense_splits").delete().eq("expense_id", expenseDeleteId);
      if (deleteSplitError) { setError(deleteSplitError.message); return; }
      const { error: deleteExpenseError } = await supabase.from("expenses").delete().eq("id", expenseDeleteId);
      if (deleteExpenseError) { setError(deleteExpenseError.message); return; }
      setExpenseDeleteId(null); setPin(""); setError(""); setModal(null); await load();
      return;
    }

'''
          replace_once(marker, delete_branch + marker, 'expense delete verification')

          page.write_text(text)
          print('patched page.tsx')
          PY

          cat > supabase/migrations/202610030001_shared_expense_payers.sql <<'SQL'
          -- Shared expense payer support for Rally365 group settlements.
          alter table public.expenses
            add column if not exists paid_by_player_id uuid references public.players(id) on delete set null;

          create index if not exists expenses_paid_by_player_id_idx
            on public.expenses(paid_by_player_id);
          SQL

          cat >> app/globals.css <<'CSS'

          /* Shared expense ledger */
          .money-balance-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:0 0 18px}
          .money-balance-card{border:1px solid #dfe8e2;border-radius:20px;padding:18px;background:#fff;display:flex;flex-direction:column;gap:5px}
          .money-balance-card span{font-size:12px;font-weight:800;letter-spacing:.12em;color:#73867d}
          .money-balance-card strong{font-size:28px;line-height:1.1;color:#10251d}
          .money-balance-card small{font-size:13px;color:#82938b}
          .money-balance-card.owe{background:#fff7f7;border-color:#f0d9d9}.money-balance-card.owe strong{color:#b13d3d}
          .money-balance-card.receive{background:#f1fbf6;border-color:#ccebdd}.money-balance-card.receive strong{color:#08784b}
          .money-ledger-warning{display:flex;flex-direction:column;gap:3px;border:1px solid #ecd9ad;background:#fff9e9;border-radius:16px;padding:13px 15px;margin:0 0 18px;color:#76581b}.money-ledger-warning span{font-size:13px;color:#8b7550}
          .money-settlement-panel,.money-balance-list{margin:0 0 20px}.money-settlement-list{display:flex;flex-direction:column;gap:8px}.money-settlement-row{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid #dfe8e2;background:#fff;border-radius:16px;padding:13px 15px}.money-settlement-row div{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.money-settlement-row div span{color:#82938b;font-size:13px}.money-settlement-row strong{color:#08784b;white-space:nowrap}
          .money-balance-row{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #e8eeea;padding:12px 4px}.money-balance-row div{display:flex;flex-direction:column;gap:2px}.money-balance-row small{color:#87968f;font-size:12px}.money-balance-row strong{white-space:nowrap}.money-balance-row strong.positive{color:#08784b}.money-balance-row strong.negative{color:#b13d3d}.money-balance-row strong.neutral{color:#7f8e87}
