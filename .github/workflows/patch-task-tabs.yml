name: Patch Rally365 task tabs

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()

          old = '  const [taskView, setTaskView] = useState<"tasks" | "history">("tasks");'
          new = old + '\n  const [taskKindFilter, setTaskKindFilter] = useState<"rivalry" | "partnership" | "streak" | "milestone" | "performance" | null>(null);'
          if old not in s:
              raise SystemExit('state pattern not found')
          s = s.replace(old, new, 1)

          old = '  const selectedDailyTasks = taskPlayerId ? (dailyTasksByPlayer.get(taskPlayerId) || []) : [];'
          new = '  const selectedDailyTasks = taskPlayerId ? (dailyTasksByPlayer.get(taskPlayerId) || []).filter(task => !taskKindFilter || task.kind === taskKindFilter) : [];'
          if old not in s:
              raise SystemExit('task list pattern not found')
          s = s.replace(old, new, 1)

          old = '<span key={kind} className={`home-task-tag home-task-tag-${kind}`}>{kind === "rivalry" ? "Rivalries" : kind === "partnership" ? "Partnerships" : kind === "streak" ? "Streaks" : kind === "milestone" ? "Milestones" : "Performance"}</span>'
          new = '<button type="button" key={kind} className={`home-task-tag home-task-tag-${kind}`} onClick={e => { e.stopPropagation(); setTaskKindFilter(kind as "rivalry" | "partnership" | "streak" | "milestone" | "performance"); setTaskView("tasks"); setTab("tasks"); }}>{kind === "rivalry" ? "Rivalries" : kind === "partnership" ? "Partnerships" : kind === "streak" ? "Streaks" : kind === "milestone" ? "Milestones" : "Performance"}</button>'
          if old not in s:
              raise SystemExit('task tag pattern not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          print('Task tab patch applied')
          PY

      - name: Commit and remove workflow
        run: |
          rm .github/workflows/patch-task-tabs.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx .github/workflows/patch-task-tabs.yml
          git commit -m 'Fix task bar tab navigation'
          git push origin main
