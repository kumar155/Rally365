name: Rally365 guest leaderboard sort

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-guest-sort:
    if: github.event.head_commit.message != 'Sort leaderboard guests below real players'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply leaderboard guest ordering
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/page.tsx')
          text = path.read_text()
          old = '''  ).sort(\n    (a, b) =>\n      b.winRate - a.winRate ||\n      b.w - a.w ||\n      b.played - a.played\n  ), [[players, filteredMatches, fines]]);'''
          new = '''  ).sort(\n    (a, b) => {\n      const aIsGuest = /^guest\\b/i.test(a.name.trim());\n      const bIsGuest = /^guest\\b/i.test(b.name.trim());\n      if (aIsGuest !== bIsGuest) return aIsGuest ? 1 : -1;\n      return b.winRate - a.winRate || b.w - a.w || b.played - a.played;\n    }\n  ), [[players, filteredMatches, fines]]);'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one leaderboard sort block, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/rally365-guest-sort.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx .github/workflows/rally365-guest-sort.yml
          git commit -m "Sort leaderboard guests below real players"
          git push origin main
