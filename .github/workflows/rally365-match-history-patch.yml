name: Rally365 Match History Patch
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Match history patch applied') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/page-legacy.tsx')
          s = p.read_text()
          s = s.replace('${m.status === "VOIDED" ? "voided" : ""}', '${m.status === "VOIDED" && !(m.last_edited_at || m.edit_count > 0) ? "voided" : ""}')
          s = s.replace('m.status === "VOIDED" ? <small>VOIDED</small> : (m.last_edited_at || m.edit_count > 0) ? <small style=', '(m.status === "VOIDED" && !(m.last_edited_at || m.edit_count > 0)) ? <small>VOIDED</small> : (m.last_edited_at || m.edit_count > 0) ? <small style=')
          s = s.replace('{m.status !== "VOIDED" && <button', '{!(m.status === "VOIDED" && !(m.last_edited_at || m.edit_count > 0)) && <button')
          old = 'const matchTeamLabel = (m: Match, t: "A" | "B") => {\n    const raw = team(m, t).replace(/^(?:vs\\s+)+/i, "").trim();\n    return raw.replace(/\\s*(?:\\/|&)\\s*/g, " - ");\n  };'
          new = 'const matchTeamLabel = (m: Match, t: "A" | "B") => {\n    const raw = team(m, t).replace(/^(?:vs\\s*)+/i, "").trim();\n    return raw.replace(/\\s*(?:\\/|&)\\s*/g, " - ");\n  };'
          s = s.replace(old, new)
          p.write_text(s)
          css = Path('app/match-history-final-fixes.css')
          c = css.read_text()
          marker = '/* Match history typography: lighter, compact player/score weights. */'
          if marker not in c:
              c += '\n\n' + marker + '''\n.home-match-history .home-history-score-card .home-team-win { font-weight: 600 !important; }\n.home-match-history .home-history-score-card .home-team-loss,\n.home-match-history .home-history-score-card > .teams > div > strong:not(.home-team-win):not(.home-team-loss) { font-weight: 450 !important; }\n.home-match-history .home-history-score-card > div:nth-child(3) > b { font-weight: 650 !important; }\n.home-match-history .home-history-score-card > div:nth-child(3) > span { font-weight: 450 !important; }\n'''
              css.write_text(c)
          PY
      - name: Verify build
        run: npm ci && npm run build
      - name: Commit patch and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page-legacy.tsx app/match-history-final-fixes.css
          git commit -m 'Match history patch applied'
          git rm .github/workflows/rally365-match-history-patch.yml
          git commit -m 'Remove temporary match history patch workflow'
          git push origin main
