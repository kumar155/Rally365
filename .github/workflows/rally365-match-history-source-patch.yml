name: Rally365 Match History Source Patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Edited match status hardening') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/page-legacy.tsx')
          s = p.read_text()
          old = '${m.status === "VOIDED" ? "voided" : ""}'
          new = '${m.status === "VOIDED" && !(m.last_edited_at || m.edit_count > 0) ? "voided" : ""}'
          assert old in s, 'voided class pattern not found'
          s = s.replace(old, new, 1)
          old = 'm.status === "VOIDED" ? <small>VOIDED</small> : (m.last_edited_at || m.edit_count > 0) ? <small style='
          new = '(m.status === "VOIDED" && !(m.last_edited_at || m.edit_count > 0)) ? <small>VOIDED</small> : (m.last_edited_at || m.edit_count > 0) ? <small style='
          assert old in s, 'voided badge pattern not found'
          s = s.replace(old, new, 1)
          old = '{m.status !== "VOIDED" && <button'
          new = '{!(m.status === "VOIDED" && !(m.last_edited_at || m.edit_count > 0)) && <button'
          assert old in s, 'edit button pattern not found'
          s = s.replace(old, new, 1)
          p.write_text(s)
          css = Path('app/match-history-final-fixes.css')
          c = css.read_text()
          marker = '/* Match history typography: lighter, compact player/score weights. */'
          if marker not in c:
              c += '''\n\n/* Match history typography: lighter, compact player/score weights. */\n.home-match-history .home-history-score-card .home-team-win { font-weight: 600 !important; }\n.home-match-history .home-history-score-card .home-team-loss,\n.home-match-history .home-history-score-card > .teams > div > strong:not(.home-team-win):not(.home-team-loss) { font-weight: 450 !important; }\n.home-match-history .home-history-score-card > div:nth-child(3) > b { font-weight: 650 !important; }\n.home-match-history .home-history-score-card > div:nth-child(3) > span { font-weight: 450 !important; }\n'''
              css.write_text(c)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page-legacy.tsx app/match-history-final-fixes.css .github/workflows/rally365-match-history-source-patch.yml
          git commit -m 'Edited match status hardening'
          git rm .github/workflows/rally365-match-history-source-patch.yml
          git commit -m 'Remove temporary match history source patch workflow'
          git push origin main
