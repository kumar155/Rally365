name: One-off Rally365 match label fix
on:
  push:
    paths:
      - '.github/rally365-match-label-fix.trigger'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix duplicate vs prefix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()
          old = r'const raw = team(m, t).replace(/^vs\s+/i, "").trim();'
          new = r'const raw = team(m, t).replace(/^(?:vs\s+)+/i, "").trim();'
          if old not in s:
              raise SystemExit('Expected matchTeamLabel line not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Remove one-off trigger and workflow
        run: |
          rm -f .github/rally365-match-label-fix.trigger
          rm -f .github/workflows/rally365-match-label-fix.yml
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx .github/rally365-match-label-fix.trigger .github/workflows/rally365-match-label-fix.yml
          git commit -m 'Fix duplicate vs prefix in match history'
          git push
