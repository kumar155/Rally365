<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Rally365 loading</title>
  <desc id="desc">Rally365 badminton splash screen with rackets, shuttlecocks and golden motion trails.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="62%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.62" stop-color="#f5fbf7"/>
      <stop offset="1" stop-color="#e8f3ed"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#baf2c9" stop-opacity=".72"/>
      <stop offset="1" stop-color="#baf2c9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d79b17" stop-opacity=".05"/>
      <stop offset=".35" stop-color="#f5c84b"/>
      <stop offset=".72" stop-color="#ffd86a"/>
      <stop offset="1" stop-color="#d79b17" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c6f42"/>
      <stop offset="1" stop-color="#159b60"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity=".18"/></filter>
  </defs>

  <rect width="1200" height="1200" rx="70" fill="url(#bg)"/>
  <circle cx="600" cy="565" r="310" fill="url(#glow)" filter="url(#blur)"/>

  <!-- golden rally trails -->
  <g fill="none" stroke="url(#gold)" stroke-linecap="round">
    <path d="M245 355 C430 120 795 100 1010 365" stroke-width="24"/>
    <path d="M205 400 C430 165 780 150 1050 410" stroke-width="9" opacity=".85"/>
    <path d="M240 790 C455 1015 800 1035 1015 785" stroke-width="17" opacity=".9"/>
  </g>

  <!-- shuttlecocks -->
  <g filter="url(#shadow)">
    <g transform="translate(845 185) rotate(18)">
      <path d="M0 0 L78 26 L53 105 L-8 78 Z" fill="#fff" stroke="#d7ddd9" stroke-width="4"/>
      <path d="M7 5 L65 25 M-1 23 L58 43 M-7 44 L52 63 M-8 65 L46 84" stroke="#d8dedb" stroke-width="4"/>
      <ellipse cx="22" cy="103" rx="34" ry="18" fill="#176d46"/>
      <circle cx="-4" cy="106" r="17" fill="#fff" stroke="#d0d6d3" stroke-width="4"/>
    </g>
    <g transform="translate(290 220) rotate(-25) scale(.72)">
      <path d="M0 0 L78 26 L53 105 L-8 78 Z" fill="#fff" stroke="#d7ddd9" stroke-width="4"/>
      <path d="M7 5 L65 25 M-1 23 L58 43 M-7 44 L52 63 M-8 65 L46 84" stroke="#d8dedb" stroke-width="4"/>
      <ellipse cx="22" cy="103" rx="34" ry="18" fill="#176d46"/>
      <circle cx="-4" cy="106" r="17" fill="#fff" stroke="#d0d6d3" stroke-width="4"/>
    </g>
  </g>

  <!-- rackets -->
  <g fill="none" stroke="#d91f2b" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
    <g transform="translate(145 290) rotate(-32)">
      <ellipse cx="105" cy="110" rx="78" ry="105" stroke-width="18"/>
      <path d="M105 215 L142 390" stroke-width="22"/>
      <path d="M142 390 L174 455" stroke-width="17"/>
      <g stroke="#c9d0cd" stroke-width="3" opacity=".9">
        <path d="M40 35 L170 185 M25 65 L155 210 M17 100 L122 215 M20 145 L85 205"/>
        <path d="M170 35 L40 185 M185 65 L55 210 M193 100 L88 215 M190 145 L125 205"/>
      </g>
    </g>
    <g transform="translate(820 680) rotate(145) scale(.92)">
      <ellipse cx="105" cy="110" rx="78" ry="105" stroke-width="18"/>
      <path d="M105 215 L142 390" stroke-width="22"/>
      <path d="M142 390 L174 455" stroke-width="17"/>
      <g stroke="#c9d0cd" stroke-width="3" opacity=".9">
        <path d="M40 35 L170 185 M25 65 L155 210 M17 100 L122 215 M20 145 L85 205"/>
        <path d="M170 35 L40 185 M185 65 L55 210 M193 100 L88 215 M190 145 L125 205"/>
      </g>
    </g>
  </g>

  <!-- logo -->
  <g transform="translate(600 555)" filter="url(#shadow)">
    <circle r="214" fill="#fff" opacity=".9"/>
    <circle r="190" fill="url(#green)"/>
    <circle r="169" fill="none" stroke="#fff" stroke-width="7" opacity=".95"/>
    <text x="0" y="-72" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="67" font-weight="800" letter-spacing="8" fill="#fff">RALLY</text>
    <text x="0" y="112" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="72" font-weight="900" letter-spacing="14" fill="#fff">365</text>
    <path d="M-55 8 L-10 50 L34 0" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round"/>
    <circle cx="0" cy="-2" r="28" fill="none" stroke="#fff" stroke-width="8"/>
    <path d="M-13 -24 L13 -24 M-20 -13 L20 -13 M-23 -2 L23 -2" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <path d="M-125 10 l-30 0 M125 10 l30 0" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- progress -->
  <rect x="365" y="1010" width="470" height="22" rx="11" fill="#d9e9e1"/>
  <rect x="365" y="1010" width="285" height="22" rx="11" fill="#159b60">
    <animate attributeName="width" values="120;360;285;360" dur="2.8s" repeatCount="indefinite"/>
  </rect>
  <text x="600" y="1085" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="600" fill="#47675a">Loading Rally365…</text>
</svg>
