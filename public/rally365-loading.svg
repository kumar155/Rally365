<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 864 1536" role="img" aria-labelledby="title desc">
  <title id="title">Rally365 splash screen</title>
  <desc id="desc">Rally365 badminton splash artwork with red rackets, golden shuttle trails and the Rally365 green logo.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".25" stop-color="#f6c94c"/>
      <stop offset=".58" stop-color="#ffd95f"/>
      <stop offset="1" stop-color="#d89a17" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="logoGlow">
      <stop offset="0" stop-color="#d9ffd9" stop-opacity=".95"/>
      <stop offset=".7" stop-color="#c9f5cf" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08723f"/>
      <stop offset="1" stop-color="#159b5d"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect width="864" height="1536" fill="#fff"/>

  <!-- golden rally motion -->
  <g fill="none" stroke-linecap="round">
    <path d="M38 315 C175 75 475 35 744 270 C818 335 843 450 780 575" stroke="url(#gold)" stroke-width="34" opacity=".95"/>
    <path d="M35 350 C195 105 485 82 730 292" stroke="#f6c94c" stroke-width="8" opacity=".7"/>
    <path d="M160 1190 C350 1395 635 1408 818 1130" stroke="url(#gold)" stroke-width="28" opacity=".9"/>
    <path d="M95 1240 C320 1450 630 1438 820 1180" stroke="#ffd75e" stroke-width="9" opacity=".65"/>
  </g>

  <!-- shuttlecock trail echoes -->
  <g fill="#fff" stroke="#d9ddda" stroke-width="3" filter="url(#shadow)">
    <g transform="translate(105 105) rotate(12) scale(.7)">
      <path d="M0 0 L92 30 L60 135 L-12 98 Z"/>
      <path d="M10 8 L76 30 M1 36 L67 58 M-7 65 L59 86 M-11 94 L52 113" fill="none"/>
      <ellipse cx="25" cy="130" rx="39" ry="21" fill="#177148"/>
      <circle cx="-7" cy="133" r="19"/>
    </g>
    <g transform="translate(285 62) rotate(16) scale(.86)">
      <path d="M0 0 L92 30 L60 135 L-12 98 Z"/>
      <path d="M10 8 L76 30 M1 36 L67 58 M-7 65 L59 86 M-11 94 L52 113" fill="none"/>
      <ellipse cx="25" cy="130" rx="39" ry="21" fill="#177148"/>
      <circle cx="-7" cy="133" r="19"/>
    </g>
    <g transform="translate(430 145) rotate(18) scale(.65)">
      <path d="M0 0 L92 30 L60 135 L-12 98 Z"/>
      <path d="M10 8 L76 30 M1 36 L67 58 M-7 65 L59 86 M-11 94 L52 113" fill="none"/>
      <ellipse cx="25" cy="130" rx="39" ry="21" fill="#177148"/>
      <circle cx="-7" cy="133" r="19"/>
    </g>
    <g transform="translate(655 365) rotate(20) scale(1.05)">
      <path d="M0 0 L92 30 L60 135 L-12 98 Z"/>
      <path d="M10 8 L76 30 M1 36 L67 58 M-7 65 L59 86 M-11 94 L52 113" fill="none"/>
      <ellipse cx="25" cy="130" rx="39" ry="21" fill="#177148"/>
      <circle cx="-7" cy="133" r="19"/>
    </g>
  </g>

  <!-- left racket -->
  <g transform="translate(-42 195) rotate(-25)" filter="url(#shadow)">
    <ellipse cx="135" cy="145" rx="112" ry="145" fill="#fff" stroke="#c91424" stroke-width="24"/>
    <ellipse cx="135" cy="145" rx="91" ry="123" fill="none" stroke="#e53540" stroke-width="5"/>
    <g stroke="#aeb8b4" stroke-width="2" opacity=".9">
      <path d="M45 60 L210 220 M36 98 L175 248 M32 142 L125 270 M42 190 L78 255"/>
      <path d="M225 60 L60 220 M234 98 L95 248 M238 142 L145 270 M228 190 L192 255"/>
    </g>
    <path d="M135 287 L177 500" stroke="#d51c2d" stroke-width="28" stroke-linecap="round"/>
    <path d="M177 500 L210 575" stroke="#c91525" stroke-width="22" stroke-linecap="round"/>
  </g>

  <!-- right racket -->
  <g transform="translate(650 930) rotate(28)" filter="url(#shadow)">
    <ellipse cx="135" cy="145" rx="112" ry="145" fill="#fff" stroke="#c91424" stroke-width="24"/>
    <ellipse cx="135" cy="145" rx="91" ry="123" fill="none" stroke="#e53540" stroke-width="5"/>
    <g stroke="#aeb8b4" stroke-width="2" opacity=".9">
      <path d="M45 60 L210 220 M36 98 L175 248 M32 142 L125 270 M42 190 L78 255"/>
      <path d="M225 60 L60 220 M234 98 L95 248 M238 142 L145 270 M228 190 L192 255"/>
    </g>
    <path d="M135 287 L177 500" stroke="#d51c2d" stroke-width="28" stroke-linecap="round"/>
    <path d="M177 500 L210 575" stroke="#c91525" stroke-width="22" stroke-linecap="round"/>
  </g>

  <!-- central glow -->
  <circle cx="432" cy="780" r="300" fill="url(#logoGlow)" filter="url(#soft)"/>
  <circle cx="432" cy="780" r="235" fill="#fff" opacity=".82"/>

  <!-- Rally365 logo -->
  <g transform="translate(432 780)" filter="url(#shadow)">
    <circle r="185" fill="url(#green)"/>
    <circle r="164" fill="none" stroke="#fff" stroke-width="7"/>
    <text x="0" y="-58" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="59" font-weight="900" letter-spacing="7" fill="#fff">RALLY</text>

    <!-- crossed rackets -->
    <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="-42" cy="12" rx="31" ry="43" stroke-width="8" transform="rotate(-28 -42 12)"/>
      <ellipse cx="42" cy="12" rx="31" ry="43" stroke-width="8" transform="rotate(28 42 12)"/>
      <path d="M-25 43 L-7 91 M25 43 L7 91" stroke-width="9"/>
      <path d="M-7 91 L-1 104 M7 91 L1 104" stroke-width="7"/>
      <path d="M-65 -2 L-20 38 M-68 15 L-22 48 M65 -2 L20 38 M68 15 L22 48" stroke-width="2.5" opacity=".85"/>
    </g>
    <!-- shuttle -->
    <path d="M-10 -20 L10 -20 L7 5 L-7 5 Z" fill="#fff"/>
    <path d="M-9 -14 L9 -14 M-10 -7 L10 -7 M-9 0 L9 0" stroke="#177148" stroke-width="2"/>
    <circle cx="0" cy="12" r="9" fill="#fff"/>
    <text x="0" y="123" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="66" font-weight="900" letter-spacing="12" fill="#fff">365</text>
    <path d="M-130 22 H-105 M130 22 H105" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- gold particles -->
  <g fill="#e0a21b" opacity=".8">
    <ellipse cx="82" cy="670" rx="7" ry="15" transform="rotate(38 82 670)"/>
    <ellipse cx="126" cy="800" rx="6" ry="13" transform="rotate(28 126 800)"/>
    <ellipse cx="738" cy="715" rx="6" ry="15" transform="rotate(28 738 715)"/>
    <ellipse cx="774" cy="860" rx="8" ry="17" transform="rotate(35 774 860)"/>
    <ellipse cx="132" cy="1090" rx="6" ry="14" transform="rotate(40 132 1090)"/>
    <ellipse cx="710" cy="1080" rx="7" ry="15" transform="rotate(32 710 1080)"/>
  </g>
</svg>